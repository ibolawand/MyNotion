<div class="starting-page-container">
    <div class="content">
        <div class="logo-container">
            <div class="logo-icon">📓</div>
            <h1>Chronicle Notes</h1>
        </div>
        <p class="subtitle">What would you like to update today?</p>

        <div class="options-grid">
            <div class="option-card" (click)="openHome()">
                <div class="icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    </svg>
                </div>
                <h3>Home</h3>
                <p>Access your notes and dashboard</p>
            </div>

            <div class="option-card" (click)="modelService.toggleCalendar()">
                <div class="icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </div>
                <h3>Calendar</h3>
                <p>Manage your schedule and events</p>
            </div>

            <div class="option-card" (click)="modelService.openHome()">
                <div class="icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
                <h3>Notebooks</h3>
                <p>Browse your organized collections</p>
            </div>
        </div>
        <app-chat-bot></app-chat-bot>
    </div>
</div>
