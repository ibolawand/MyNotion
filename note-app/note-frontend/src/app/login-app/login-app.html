<div class="login-container">
    <div class="login-card">
        <div class="header">
            <div class="logo-icon">📓</div>
            <h2>Welcome Back</h2>
            <p>Sign in to continue to Chronicle Notes</p>
        </div>

        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="text" [(ngModel)]="user.username" name="username" placeholder="Enter your username"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" [(ngModel)]="user.password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <button (click)="onSubmit()" type="submit" class="submit-btn" [disabled]="!user.username || !user.password">
                Sign In
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>

            <div class="divider">or</div>

            <div class="footer-links">
                <p>Don't have an account? <a routerLink="/create-account">Create Account</a></p>
            </div>
        </form>
    </div>
</div>
