<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronicle Notes</title>
</head>

<body>
  <div class="container">
    <app-window-bar></app-window-bar>

    <app-adder></app-adder>
    }


  </div>

</html>
