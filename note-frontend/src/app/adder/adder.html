@if (modelService.isOpen$ | async) {
  <div class="main-content">
    <div class="content-header">
      <input placeholder="Write your title here" type="text" [(ngModel)]="title" (ngModelChange)="onTitleChange($event)">
      <div class="content-actions">
        <button class="icon-btn" title="Star note">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </button>
      </div>
    </div>

    <!-- Metadata Bar for Folder and Category -->
    <div class="note-meta-bar">
      <div class="meta-item">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        <label for="newNoteFolderSelect" class="meta-label">Folder:</label>
        <select id="newNoteFolderSelect" class="meta-select" [(ngModel)]="currentNote.folderID" (ngModelChange)="onFolderChange($event)">
          <option [value]="0">No folder</option>
          @for (folder of folders; track folder.id) {
            <option [value]="folder.id">{{ folder.name }}</option>
          }
        </select>
      </div>

      <div class="meta-item">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
          <line x1="7" y1="7" x2="7.01" y2="7"></line>
        </svg>
        <label for="newNoteCategorySelect" class="meta-label">Category:</label>
        <select id="newNoteCategorySelect" class="meta-select" [(ngModel)]="currentNote.categoryID" (ngModelChange)="onCategoryChange($event)">
          <option [value]="0">Uncategorized</option>
          @for (cat of categories; track cat.id) {
            <option [value]="cat.id">{{ cat.name }}</option>
          }
        </select>
      </div>

      <div class="meta-status">
        <span>🔄 <small>{{ noteService.saveStatus$ | async }}</small></span>
      </div>
    </div>

    <div class="content-body">
      <div class="editor-toolbar">
        <button class="toolbar-btn" title="Bold">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
            <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
          </svg>
        </button>
        <button class="toolbar-btn" title="Italic">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="4" x2="10" y2="4"></line>
            <line x1="14" y1="20" x2="5" y2="20"></line>
            <line x1="15" y1="4" x2="9" y2="20"></line>
          </svg>
        </button>
        <button class="toolbar-btn" title="Underline">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 3v7a6 6 0 0 0 12 0V3"></path>
            <line x1="4" y1="21" x2="20" y2="21"></line>
          </svg>
        </button>
        <button class="toolbar-btn" title="List">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="content-text">
        <textarea placeholder="Start writing your note here..." [(ngModel)]="content" (ngModelChange)="onContentChange($event)"></textarea>
      </div>
    </div>

    <div class="content-footer">
      <div>
        <span>Words: {{ getWordCount() }} | Chars: {{ getCharCount() }}</span>
      </div>
      <div style="margin-left:auto;">
        <span>🔄 <small>{{ noteService.saveStatus$ | async }}</small></span>
      </div>
    </div>
  </div>
}
