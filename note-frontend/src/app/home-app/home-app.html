<div class="container">
  <app-window-bar></app-window-bar>

  @if (!(modelService.isLoggedIn | async)) {
  <app-create-account></app-create-account>
  }

  @if (modelService.openDashboard$ | async) {
  <app-quick-search></app-quick-search>
  <app-undo-bar></app-undo-bar>
  <div class="workspace-col">
    <app-top-bar></app-top-bar>
    <div class="workspace">
      @switch ((modelService.workspace$ | async)?.view) {
      @case ('inbox') { <app-inbox></app-inbox> }
      @case ('calendar') { <app-calendar></app-calendar> }
      @case ('book') { <app-open-book></app-open-book> }
      @case ('slip') { <app-editor></app-editor> }
      @default { <app-bookshelf></app-bookshelf> }
      }
    </div>
  </div>
  @if (modelService.ariaPanelOpen$ | async) {
  <app-aria-panel></app-aria-panel>
  }
  }
</div>
