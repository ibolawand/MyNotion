<div class="sidebar">

  <!-- ===== HEADER ===== -->
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">📓</div>
      <h1>Chronicle Notes</h1>
    </div>

    <div class="search-box">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input type="text" placeholder="Search all notes...">
    </div>

    <button type="button" class="new-note-btn" (click)="modelService.toggleOpenNewNote()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      New Note
    </button>
  </div>

  <!-- ===== MAIN MENU ===== -->
  <nav class="sidebar-menu">
    <button type="button" class="menu-item"
            [class.active]="!(modelService.openCalendar$ | async)"
            (click)="modelService.openHome()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      </svg>
      Home
    </button>

    <button type="button" class="menu-item"
            [class.active]="modelService.openCalendar$ | async"
            (click)="modelService.toggleCalendar()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
        <line x1="3" y1="10" x2="21" y2="10" />
        <line x1="16" y1="2" x2="16" y2="6" />
        <line x1="8" y1="2" x2="8" y2="6" />
      </svg>
      Calendar
    </button>

    <button type="button" class="menu-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
        <line x1="7" y1="7" x2="7.01" y2="7"></line>
      </svg>
      Tags
    </button>
  </nav>

  <!-- ===== NOTEBOOKS ===== -->
  <div class="notebooks-section">
    <div class="section-header">
      <div class="section-title">Notebooks</div>
      <button type="button" class="add-folder-btn" title="Add notebook" aria-label="Add notebook"
              (click)="openFolderAdder()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <!-- all notes -->
    <div class="folder-item" (click)="selectAll()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      <span class="folder-name">All notes</span>
    </div>

    <!-- notebooks -->
    @for (row of folderRows; track row.folder.id) {
      <div class="folder-item" [style.padding-left.px]="12 + row.depth * 16" (click)="selectFolder(row.folder)">

        @if (row.hasChildren) {
          <button type="button" class="folder-toggle" (click)="toggleExpand(row.folder.id, $event)">
            <svg [class.expanded]="expanded.has(row.folder.id)" width="12" height="12" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        } @else {
          <span class="folder-toggle-spacer"></span>
        }

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" [attr.stroke]="row.folder.colour" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="folder-name">{{ row.folder.name }}</span>

        <button type="button" class="folder-add" title="Add subfolder"
                (click)="$event.stopPropagation(); openAddFolderWindow(row.folder.id)">+</button>
        <button type="button" class="folder-delete" title="Delete notebook"
                (click)="$event.stopPropagation(); deleteFolder(row.folder)">…dein Trash-SVG…</button>
      </div>
    }
  </div>

  <app-folder-adder></app-folder-adder>
</div>
